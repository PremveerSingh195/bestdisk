appId: com.yourname.diskanalyzer
productName: Bestdisk
copyright: Copyright © 2024

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSDesktopFolderUsageDescription: Bestdisk needs access to scan folders and analyze disk usage.
    NSDocumentsFolderUsageDescription: Bestdisk needs access to analyze your Documents folder.
    NSDownloadsFolderUsageDescription: Bestdisk needs access to analyze your Downloads folder.
    NSRemovableVolumesUsageDescription: Bestdisk needs access to scan external volumes.
    LSMinimumSystemVersion: '11.0'

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
